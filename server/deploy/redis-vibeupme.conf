# Kopyala: /etc/redis/redis.conf içindeki ilgili satırları değiştir (ya da include /etc/redis/vibeupme.conf)
# Redis burada kalıcı veri deposu değil: hız sınırı sayaçları, Socket.IO yayını ve çevrimiçi durum. Kaybolursa sistem toparlar.
bind 127.0.0.1 -::1
protected-mode yes
requirepass DEGISTIR-uzun-rastgele-bir-parola
maxmemory 1gb
maxmemory-policy volatile-lru           # sadece süreli anahtarlar silinir; çevrimiçi ZSET'i temizliği uygulama yapar
save ""                                 # diske dökme yok (gerek yok, yazma yükü olmasın)
appendonly no
