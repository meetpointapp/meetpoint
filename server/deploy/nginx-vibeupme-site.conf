# vibeupme.com tanıtım sitesi (statik). Kopyala: /etc/nginx/sites-available/vibeupme-site
# (setup-ubuntu.sh bunu otomatik yapar). TLS: certbot --nginx -d vibeupme.com -d www.vibeupme.com
# Site dosyaları depodaki site/ klasörüdür (python site/build.py ile üretilir, çıktılar depoda hazırdır).

server {
    # Önce sadece 80'de dinler; `certbot --nginx -d vibeupme.com -d www.vibeupme.com` HTTPS'i ve yönlendirmeyi ekler.
    # www ve çıplak alan adı aynı içeriği sunar (sayfadaki canonical adres vibeupme.com).
    listen 80;
    server_name vibeupme.com www.vibeupme.com;

    root /opt/vibeupme/site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }
    # Görseller, CSS ve betik: uzun önbellek (dosya adı değişince yenilenir)
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~* \.(css|js)$ { expires 1h; }

    # Derleme betiği ve şablon dışarıya açılmasın
    location ~ ^/(build\.py|template\.html)$ { return 404; }
}
