# /etc/nginx/sites-available/vibeupme  (sonra: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
# TLS için certbot:  certbot --nginx -d api.vibeupme.com
# Cloudflare ARKASINDAYSA: gerçek istemci IP'si için aşağıdaki real_ip bloğunu açın (adresler: cloudflare.com/ips)

upstream vibeupme_api {
    server 127.0.0.1:4000;   # pm2 cluster tek bağlantı noktası
    keepalive 64;
}

# Giriş/kayıt gibi uçlara ek koruma (uygulamanın kendi sınırlayıcısına ek, yük binmeden nginx'te keser)
limit_req_zone $binary_remote_addr zone=auth_zone:20m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.vibeupme.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vibeupme.com;

    # certbot bu iki satırı kendisi ekler
    # ssl_certificate     /etc/letsencrypt/live/api.vibeupme.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.vibeupme.com/privkey.pem;

    # set_real_ip_from 173.245.48.0/20;   # (Cloudflare aralıkları, hepsini ekleyin)
    # real_ip_header CF-Connecting-IP;

    client_max_body_size 12m;          # fotoğraf yükleme
    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Uygulama (5651 kaydı için) gerçek IP ve kaynak port başlıklarını okur
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /socket.io/ {
        proxy_pass http://vibeupme_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;       # uygulama ~25 sn'de bir ping atar
        proxy_send_timeout 120s;
    }

    location /auth/ {
        limit_req zone=auth_zone burst=30 nodelay;
        proxy_pass http://vibeupme_api;
    }

    # Fotoğraflar: adresler imzalı ve süreli, yanıt "immutable". Cloudflare/CDN bu yolu önbelleğe alırsa
    # API'ye sadece ilk istek düşer.
    location /media/ {
        proxy_pass http://vibeupme_api;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://vibeupme_api;
        proxy_read_timeout 60s;
    }
}
