# 16 GB RAM, 4 çekirdek, NVMe için başlangıç ayarları.
# Kopyala:  /etc/postgresql/<sürüm>/main/conf.d/vibeupme.conf   sonra: systemctl restart postgresql
# RAM/çekirdek değişirse: shared_buffers ≈ RAM'in %25'i, effective_cache_size ≈ %65-70'i.

listen_addresses = 'localhost'          # veritabanı dışarıya açık olmasın (ayrı sunucuya geçince özel ağ adresi eklenir)
max_connections = 200                   # 3 API süreci x (Prisma 15 + doğrudan havuz 4) + yönetim payı

shared_buffers = 4GB
effective_cache_size = 11GB
work_mem = 16MB                         # sıralama/birleştirme başına; keşfet sorgusu için yeterli
maintenance_work_mem = 1GB

# NVMe disk
random_page_cost = 1.1
effective_io_concurrency = 200

# Yazma: çökme güvenliğinden ödün vermeden yük düşürür
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Yavaş sorguları ve darboğazı bulmak için
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500        # 500 ms'den uzun sorguları günlüğe yaz
track_io_timing = on
